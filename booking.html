<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book N's Bridal & Fashion</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="booking-page"><div class="booking-card"><div class="hero-brand"><img src="assets/brand/logo.jpg" alt="N's Bridal & Fashion"><div><h1>N's Bridal & Fashion</h1><p>Rental / fitting / wedding package inquiry</p></div></div><div id="bookingMessage" class="notice">Tell us what you need and we’ll contact you to confirm availability.</div><form id="bookingForm" class="form-grid" style="margin-top:16px"><div class="field"><label>Name</label><input class="input" name="name" required></div><div class="field"><label>Mobile Number</label><input class="input" name="phone" required></div><div class="field"><label>Email</label><input class="input" type="email" name="email"></div><div class="field"><label>Event Date</label><input class="input" type="date" name="event_date"></div><div class="field"><label>What are you interested in?</label><select class="select" name="interest"><option>Gown rental</option><option>Dress rental</option><option>Tuxedo / Barong</option><option>Wedding package</option><option>Purchase</option><option>Fitting appointment</option></select></div><div class="field"><label>Preferred Contact</label><select class="select" name="preferred_contact"><option>Call / Text</option><option>Email</option><option>Facebook Messenger</option></select></div><div class="field span-2"><label>Message / Size / Color / Package</label><textarea class="textarea" name="notes"></textarea></div><div class="form-actions span-2"><button class="primary" type="submit">Send Booking Request</button></div></form><div class="contact-card" style="margin-top:20px"><strong>Contact us</strong><span>+63 930 985 9546</span><span>nsbridal.fashion@gmail.com</span><span>Purok 1 Barangay Marcos, 8600 Magallanes, Philippines</span></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="cloud.js"></script><script>
document.getElementById('bookingForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='Sending...';try{const f=Object.fromEntries(new FormData(e.target));f.status='New';await NSCloud.submitBooking(f);document.getElementById('bookingMessage').innerHTML='<strong>Thank you!</strong> Your request was recorded. We will contact you to confirm.';e.target.reset();}catch(err){document.getElementById('bookingMessage').textContent='Could not submit yet: '+err.message;}finally{btn.disabled=false;btn.textContent='Send Booking Request';}});
</script></body></html>
